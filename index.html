<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a07">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>termOS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a07;--fg:#39ff88;--dim:#1f7a48;--acc:#ffb000;--err:#ff4d6d;--txt:#d4ead9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.16) 2px 4px)}
#fx{position:fixed;inset:0;z-index:0;opacity:.14;pointer-events:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:11px;border-bottom:1px solid var(--dim);background:color-mix(in srgb,var(--bg) 85%,transparent)}
#bar b{color:var(--fg)}
#bar .r span{margin-left:10px}
#tabs{display:flex;border-bottom:1px solid var(--dim)}
#tabs button{flex:1;border:0;border-radius:0;padding:8px;font-weight:700;letter-spacing:2px;color:var(--dim)}
#tabs button.on{color:var(--bg);background:var(--fg)}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
#vHome{overflow-y:auto;padding-bottom:20px;overscroll-behavior:contain}
.card{border:1px solid var(--dim);border-radius:10px;margin:10px 12px 0;padding:10px 12px;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.card h4{margin:0 0 8px;color:var(--acc);font-size:11px;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h4 .r{display:flex;gap:6px}
.big{font-size:44px;font-weight:800;color:var(--fg);text-shadow:0 0 14px var(--fg);line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px;margin-top:8px}
.kv span:nth-child(odd){color:var(--dim)}
.sm{font-size:11px;padding:3px 8px}
.it{padding:7px 0;border-bottom:1px dashed color-mix(in srgb,var(--dim) 55%,transparent);cursor:pointer}
.it:last-child{border-bottom:0}
.it .m{font-size:11px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
.bl{filter:blur(5px);transition:filter .2s;user-select:none}
.it.show .bl{filter:none;user-select:text}
.tg{font-weight:700}
.in,textarea{width:100%;background:transparent;border:1px solid var(--dim);border-radius:6px;color:var(--txt);font:inherit;font-size:16px;padding:8px;outline:0}
.in:focus,textarea:focus{border-color:var(--fg)}
.rowf{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.rowf .in,.rowf textarea{flex:1;min-width:0}
#aiLog{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.msg{white-space:pre-wrap;word-break:break-word;padding:7px 10px;border-radius:8px;max-width:92%}
.msg.u{align-self:flex-end;border:1px solid var(--dim);color:var(--txt)}
.msg.a{align-self:flex-start;background:color-mix(in srgb,var(--fg) 8%,transparent);border-left:3px solid var(--fg)}
.msg.e{align-self:flex-start;color:var(--err);border-left:3px solid var(--err)}
.msg pre{background:#000;border:1px solid var(--dim);padding:8px;border-radius:6px;overflow-x:auto;margin:6px 0;white-space:pre}
.msg code{color:var(--acc)}
.think{color:var(--dim);font-size:11px;border-left:2px solid var(--dim);padding-left:8px;margin-bottom:6px;max-height:120px;overflow-y:auto}
#out{flex:1;overflow-y:auto;padding:10px 12px;word-break:break-word;overscroll-behavior:contain}
.ln{white-space:pre-wrap;min-height:1em}
.ok{color:var(--fg)}.warn{color:var(--acc)}.err{color:var(--err)}.dim{color:var(--dim)}.b{font-weight:700}.t{color:var(--txt)}
.glow{text-shadow:0 0 6px currentColor}
.secret{filter:blur(6px);cursor:pointer;transition:filter .2s;color:var(--fg);font-weight:700}
.secret.show{filter:none}
.chip{display:inline-block;border:1px solid var(--dim);border-radius:4px;padding:0 6px;margin-left:6px;color:var(--fg);cursor:pointer;font-size:11px}
.copy{cursor:pointer}
a{color:var(--fg)}
#quick{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;border-top:1px solid var(--dim);scrollbar-width:none}
#quick::-webkit-scrollbar{display:none}
button{font:inherit;font-size:12px;background:transparent;color:var(--fg);border:1px solid var(--dim);border-radius:6px;padding:6px 10px;cursor:pointer}
button:active,button:hover{background:var(--fg);color:var(--bg)}
button:disabled{opacity:.4}
#quick button{flex:none}
#inrow{display:flex;align-items:center;gap:6px;padding:8px 12px 12px}
#ps{color:var(--fg);font-weight:700;white-space:nowrap}
#in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--txt);font:inherit;font-size:16px;caret-color:var(--fg)}
.overlay{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;background:var(--bg)}
.overlay.on{display:flex}
#boot{z-index:40;align-items:stretch;padding:16px;font-size:12px;overflow:hidden}
#lock{justify-content:space-between;padding:calc(40px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
#lkTime{font-size:68px;font-weight:800;color:var(--fg);text-shadow:0 0 18px var(--fg);text-align:center;letter-spacing:2px}
#lkDate{text-align:center;opacity:.8}
#lkSigil{width:130px;height:130px;border-radius:50%;border:2px solid var(--fg);box-shadow:0 0 24px var(--fg),inset 0 0 24px color-mix(in srgb,var(--fg) 30%,transparent);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--fg);position:relative;margin:0 auto}
#lkSigil::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:2px dashed var(--dim);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#lkMsg{text-align:center;margin-top:12px;min-height:1.5em}
#lkDots{text-align:center;font-size:22px;letter-spacing:8px;color:var(--fg);min-height:34px}
#pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
#pad button{height:72px;border-radius:50%;font-size:22px;font-weight:700}
#lkCanary{text-align:center;font-size:11px;margin-top:10px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#wall{overflow-y:auto;padding:16px;justify-content:flex-start}
#wall h3{color:var(--acc);margin:6px 0}
.phones{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.frame{width:200px;height:444px;border-radius:26px;padding:7px;background:#1a1d1b;box-shadow:0 0 0 2px #2a2f2c,0 10px 40px color-mix(in srgb,var(--fg) 20%,transparent)}
.frame canvas{width:100%;height:100%;border-radius:20px;display:block}
.phone{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
#matrix{z-index:60;background:#000}
#matrix canvas{position:absolute;inset:0}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:6px;font-size:12px;z-index:95;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#ticker{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--dim);font-size:11px;padding:4px 0;cursor:pointer}
#tickerIn{display:inline-block;padding-left:100%;animation:ticker 40s linear infinite}
#tickerIn span{margin-right:32px}
#tickerIn b{color:var(--acc)}
#ticker:active #tickerIn{animation-play-state:paused}
@keyframes ticker{to{transform:translateX(-100%)}}
#alertBar{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:96;padding:10px 12px;border-radius:8px;border:1px solid;background:var(--bg);font-size:12px;transform:translateY(-140%);transition:transform .3s;cursor:pointer;box-shadow:0 6px 30px #000}
#alertBar.on{transform:none}
#alertBar b{display:block;font-size:13px;margin-bottom:2px}
#alertBar.lv-err{border-color:var(--err)} #alertBar.lv-err b{color:var(--err)}
#alertBar.lv-warn{border-color:var(--acc)} #alertBar.lv-warn b{color:var(--acc)}
#alertBar.lv-info{border-color:var(--fg)} #alertBar.lv-info b{color:var(--fg)}
.feed .it{cursor:default}
.tag{font-weight:700;margin-right:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button.on{background:var(--fg);color:var(--bg)}
canvas.chart{width:100%;height:200px;display:block;touch-action:pan-y;outline:0}
#cam{z-index:70;background:#000;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;justify-content:flex-start;align-items:stretch}
.ovhead{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg);font-weight:700;font-size:12px;margin-bottom:8px}
#camBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#camBox iframe{width:100%;height:100%;border:0;border-radius:8px;background:#000}
#camBox img{max-width:100%;max-height:100%;border-radius:8px}
#camFoot{font-size:11px;margin-top:6px}
#patch{z-index:85;background:color-mix(in srgb,#000 70%,transparent);justify-content:center;padding:20px}
.pbox{width:100%;max-width:440px;border:1px solid var(--fg);border-radius:12px;background:var(--bg);padding:16px;box-shadow:0 0 40px color-mix(in srgb,var(--fg) 25%,transparent)}
.ptop{color:var(--dim);font-size:11px;letter-spacing:2px}
.pbox h3{color:var(--fg);margin:6px 0 10px;font-size:16px}
#patchList{margin:0;padding-left:18px;max-height:50vh;overflow-y:auto;font-size:13px}
#patchList li{margin-bottom:6px}
#patchList li::marker{content:'> ';color:var(--fg)}
canvas.chart:focus-visible{outline:1px dashed var(--dim)}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="app">
  <div id="bar">
    <div><b>termOS</b> <span id="sbTime">--:--</span></div>
    <div class="r"><span id="sbNet">NET</span><span id="sbVault"></span><span id="sbBat"></span></div>
  </div>
  <div id="tabs"><button data-v="home" class="on">BERANDA</button><button data-v="term">TERMINAL</button></div>
  <div id="ticker"><div id="tickerIn"><span><b>[termOS]</b> memuat kabar terkini...</span></div></div>

  <div id="vHome" class="view on">
    <div class="card" id="cStatus"></div>
    <div class="card" id="cFeed"></div>
    <div class="card" id="cApps"></div>
    <div class="card" id="cTraffic"></div>
    <div class="card" id="cCctv"></div>
    <div class="card" id="cChart"></div>
    <div class="card" id="cInfo"></div>
    <div class="card" id="cVault"></div>
    <div class="card" id="cAI"></div>
    <div class="card" id="cDoc"></div>
    <div class="card" id="cChats"></div>
    <div class="card" id="cCalls"></div>
    <div class="card" id="cProt"></div>
  </div>

  <div id="vTerm" class="view">
    <div id="out"></div>
    <div id="quick"></div>
    <div id="inrow"><span id="ps">root@termos:~$</span><input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></div>
  </div>
</div>

<div id="boot" class="overlay"></div>

<div id="lock" class="overlay">
  <div><div id="lkTime">--:--</div><div id="lkDate"></div></div>
  <div><div id="lkSigil">&gt;_</div><div id="lkMsg" class="dim">masukkan PIN</div><div id="lkDots"></div></div>
  <div><div id="pad"></div><div id="lkCanary" class="dim"></div></div>
</div>

<div id="wall" class="overlay">
  <h3>// wallpaper studio - 1080x2400</h3>
  <div class="row" id="wpPal"></div>
  <div class="phones">
    <div class="phone"><div class="frame"><canvas id="wpHome" width="1080" height="2400"></canvas></div><div class="row"><button data-dl="wpHome">UNDUH home.png</button></div></div>
    <div class="phone"><div class="frame"><canvas id="wpLock" width="1080" height="2400"></canvas></div><div class="row"><button data-dl="wpLock">UNDUH lock.png</button></div></div>
  </div>
  <div class="row"><button id="wpRoll">ACAK DETAIL</button><button id="wpClose">TUTUP</button></div>
  <div class="dim" style="max-width:520px;text-align:center;font-size:11px">Pasang lewat Pengaturan &gt; Wallpaper. Area tengah/bawah sengaja tidak terlalu ramai supaya ikon dan jam tetap terbaca.</div>
</div>

<div id="matrix" class="overlay"><canvas id="mx"></canvas></div>
<div id="toast"></div>
<div id="alertBar"></div>
<div id="cam" class="overlay">
  <div class="ovhead"><span id="camTitle"></span><button id="camClose" class="sm">TUTUP</button></div>
  <div id="camBox"></div>
  <div id="camFoot" class="dim"></div>
</div>
<div id="patch" class="overlay">
  <div class="pbox">
    <div class="ptop">// PATCH NOTES</div>
    <h3 id="patchTitle"></h3>
    <ul id="patchList"></ul>
    <div class="rowf"><button id="patchAct" style="flex:1"></button><button id="patchClose">NANTI</button></div>
  </div>
</div>
<input type="file" id="file" hidden>

<script>
'use strict';
/* ============================================================
   termOS 3.0 - launcher terminal + toolkit keamanan untuk HP
   Semua data disimpan lokal (localStorage / Cache API).
   Kripto: WebCrypto (PBKDF2-SHA256, AES-256-GCM, HMAC-SHA1 untuk TOTP).
   ============================================================ */
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const LS = {
  get(k, d) { try { const v = localStorage.getItem('tos.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { localStorage.setItem('tos.' + k, JSON.stringify(v)); },
  del(k) { localStorage.removeItem('tos.' + k); },
};
const THEMES = {
  phosphor: { name: 'Phosphor',   bg: '#060a07', fg: '#39ff88', dim: '#1f7a48', acc: '#ffb000', err: '#ff4d6d', txt: '#d4ead9' },
  amber:    { name: 'Amber CRT',  bg: '#0b0703', fg: '#ffb000', dim: '#7a5400', acc: '#ff6a2b', err: '#ff3b3b', txt: '#f3e2c4' },
  cyber:    { name: 'Cyber Ice',  bg: '#05070d', fg: '#5ef1ff', dim: '#1d6b78', acc: '#ff4fd8', err: '#ffcc00', txt: '#d6eef2' },
  redalert: { name: 'Red Alert',  bg: '#0a0405', fg: '#ff3355', dim: '#7a1a2a', acc: '#ffd166', err: '#ff8800', txt: '#f2d6da' },
  violet:   { name: 'Violet',     bg: '#0d0b14', fg: '#bd93f9', dim: '#4f4380', acc: '#50fa7b', err: '#ff5555', txt: '#e4defa' },
  mono:     { name: 'Paper Mono', bg: '#0a0a0a', fg: '#e8e8e8', dim: '#5c5c5c', acc: '#9be564', err: '#ff6b6b', txt: '#cfcfcf' },
};
const state = {
  nick: LS.get('nick', 'root'), theme: LS.get('theme', 'phosphor'), hist: LS.get('hist', []), hIdx: 0,
  fx: LS.get('fx', true), autolock: LS.get('autolock', 3), decoy: false, busy: false,
  vault: null, vaultKey: null, live: [], timers: [], batt: null, started: Date.now(), lastAct: Date.now(),
  secrets: new Map(), clipT: null, installEvt: null, locked: false, hiddenAt: 0,
  view: 'home', aiBusy: null, chatLimit: 25, callLimit: 25, threat: null,
};
let P = THEMES[state.theme] || THEMES.phosphor;

/* ---------------- util ---------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const noEmoji = s => String(s).replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{FE0F}\u{200D}\u{1F3FB}-\u{1F3FF}]/gu, '');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode(...u.subarray(i, i + 32768)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const meter = (f, n = 20) => { f = Math.max(0, Math.min(1, f)); const k = Math.round(f * n); return '█'.repeat(k) + '░'.repeat(n - k); };
const fmt = t => new Date(t).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const fmtS = t => new Date(t).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const pad2 = n => String(n).padStart(2, '0');
const num = n => Number(n).toLocaleString('id-ID');
function rint(n) { const a = new Uint32Array(1), lim = Math.floor(2 ** 32 / n) * n; do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; }
function human(sec) {
  if (sec < 1) return 'instan';
  const u = [['detik', 60], ['menit', 60], ['jam', 24], ['hari', 365], ['tahun', 100], ['abad', 1e9]];
  let v = sec;
  for (const [n, d] of u) { if (v < d) return `${v < 10 ? v.toFixed(1) : Math.round(v)} ${n}`; v /= d; }
  return 'lebih lama dari umur alam semesta';
}
function dur(s) { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + 'j ' : '') + (h || m ? m + 'm ' : '') + (s % 60) + 'd'; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1800); }
function audit(e, hidden = false) { const a = LS.get('audit', []); a.push({ t: Date.now(), e, h: hidden }); while (a.length > 150) a.shift(); LS.set('audit', a); }
function maskNum(n) { n = String(n || '').replace(/[^\d+]/g, ''); if (!n) return 'tanpa nomor'; return n.length > 7 ? n.slice(0, 5) + '****' + n.slice(-3) : n.replace(/\d(?=\d{2})/g, '*'); }
function pickFile(accept, multi = false) {
  const f = $('#file'); f.value = ''; f.accept = accept || ''; f.multiple = multi;
  return new Promise(r => {
    let done = false; const fin = v => { if (!done) { done = true; r(v); } };
    f.onchange = () => fin(f.files.length ? (multi ? [...f.files] : f.files[0]) : null);
    f.oncancel = () => fin(null);
    addEventListener('focus', () => setTimeout(() => { if (!f.files.length) fin(null); }, 1200), { once: true });
    f.click();
  });
}

/* ---------------- crypto ---------------- */
async function sha(alg, data) { return hex(await crypto.subtle.digest(alg, typeof data === 'string' ? enc.encode(data) : data)); }
async function pbkdf2(pass, salt, iter = 150000) {
  const k = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, k, 256));
}
async function makeHash(pin) { const salt = crypto.getRandomValues(new Uint8Array(16)); return { salt: b64(salt), hash: await pbkdf2(pin, salt), len: pin.length }; }
async function checkHash(pin, rec) {
  const h = await pbkdf2(pin, unb64(rec.salt));
  let d = h.length ^ rec.hash.length; for (let i = 0; i < h.length; i++) d |= h.charCodeAt(i) ^ (rec.hash.charCodeAt(i) || 0);
  return d === 0;
}
async function aesKey(pass, salt) {
  const k = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
function b32(s) {
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; s = s.toUpperCase().replace(/[\s=-]/g, '');
  let bits = ''; const out = [];
  for (const c of s) { const v = A.indexOf(c); if (v < 0) throw new Error('secret bukan base32 yang valid'); bits += v.toString(2).padStart(5, '0'); }
  for (let i = 0; i + 8 <= bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8), 2));
  if (!out.length) throw new Error('secret kosong');
  return new Uint8Array(out);
}
async function totp(secret, t = Date.now(), digits = 6, period = 30) {
  const key = await crypto.subtle.importKey('raw', b32(secret), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const ctr = Math.floor(t / 1000 / period), buf = new ArrayBuffer(8), dv = new DataView(buf);
  dv.setUint32(0, Math.floor(ctr / 2 ** 32)); dv.setUint32(4, ctr >>> 0);
  const h = new Uint8Array(await crypto.subtle.sign('HMAC', key, buf)), o = h[h.length - 1] & 15;
  const code = (((h[o] & 127) << 24) | (h[o + 1] << 16) | (h[o + 2] << 8) | h[o + 3]) % 10 ** digits;
  return String(code).padStart(digits, '0');
}

function strength(pw) {
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26; if (/[A-Z]/.test(pw)) pool += 26; if (/\d/.test(pw)) pool += 10; if (/[^a-zA-Z0-9]/.test(pw)) pool += 33;
  let bits = pw.length * Math.log2(pool || 1); const issues = [], low = pw.toLowerCase();
  const hit = COMMON.find(c => low.includes(c));
  if (hit) { bits = Math.min(bits, 14 + (pw.length - hit.length) * 3); issues.push(`mengandung kata/angka yang sangat umum ("${hit}")`); }
  if (/(.)\1{2,}/.test(pw)) { bits -= 10; issues.push('ada karakter berulang (aaa / 111)'); }
  if (/(012|123|234|345|456|567|678|789|890|abc|bcd|cde|qwe|wer|asd|sdf|zxc)/i.test(pw)) { bits -= 10; issues.push('ada urutan (123 / abc / qwe)'); }
  if (/(19[5-9]\d|20[0-3]\d)/.test(pw)) { bits -= 6; issues.push('mengandung tahun (tanggal lahir mudah ditebak)'); }
  if (/^[A-Z][a-z]+\d+[!@#.]?$/.test(pw)) { bits -= 8; issues.push('pola klasik Kata+angka+simbol'); }
  if (pw.length < 12) issues.push('kurang dari 12 karakter');

}

/* ---------------- link check (heuristik) ---------------- */
const SHORT = ['bit.ly', 's.id', 'tinyurl.com', 't.co', 'goo.gl', 'cutt.ly', 'shorturl.at', 'rb.gy', 'is.gd', 'ow.ly', 'tiny.cc', 'linktr.ee'];
const BRANDS = ['bca', 'bri', 'mandiri', 'bni', 'btn', 'dana', 'ovo', 'gopay', 'shopee', 'tokopedia', 'bukalapak', 'paypal', 'google', 'facebook', 'instagram', 'whatsapp', 'apple', 'microsoft', 'telegram', 'netflix', 'lazada', 'jne', 'jnt', 'pajak', 'bpjs'];
function regDomain(host) { const p = host.split('.'); if (p.length > 2 && p[p.length - 1].length === 2 && ['co', 'ac', 'go', 'or', 'com', 'net', 'web', 'my', 'sch', 'biz', 'mil'].includes(p[p.length - 2])) return p.slice(-3).join('.'); return p.slice(-2).join('.'); }
function linkCheck(raw) {
  let u; try { u = new URL(/^[a-z][\w+.-]*:\/\//i.test(raw) ? raw : 'https://' + raw); } catch { return null; }
  const f = [], host = u.hostname.toLowerCase(); let risk = 0;
  const add = (r, lvl, msg) => { risk += r; f.push([lvl, msg]); };
  if (u.protocol === 'http:') add(2, 'warn', 'tidak pakai HTTPS - data bisa diintip');
  if (!/^https?:$/.test(u.protocol)) add(2, 'warn', `protokol tidak biasa: ${u.protocol}`);
  if (/^\d+\.\d+\.\d+\.\d+$/.test(host) || host.startsWith('[')) add(3, 'err', 'host berupa alamat IP, bukan nama domain');
  if (host.split('.').some(p => p.startsWith('xn--'))) add(3, 'err', 'punycode - bisa huruf tiruan (homograph attack)');
  if (u.username || /\/\/[^/]*@/.test(raw)) add(3, 'err', 'ada "@" sebelum domain - domain asli disamarkan');
  if (host.split('.').length > 4) add(1, 'warn', 'subdomain berlapis-lapis');
  if (/-{2,}|\d{4,}/.test(host)) add(1, 'warn', 'nama domain aneh (banyak strip/angka)');
  const tld = host.split('.').pop();
  if (['zip', 'mov', 'xyz', 'top', 'click', 'gq', 'tk', 'ml', 'cf', 'ga', 'work', 'rest', 'loan', 'buzz', 'icu', 'cyou', 'sbs'].includes(tld)) add(2, 'warn', `TLD .${tld} sering dipakai untuk spam/phishing`);
  if (SHORT.includes(host)) add(1, 'warn', 'pemendek link - tujuan asli tersembunyi');
  if (/(login|verif|secure|update|account|akun|bonus|hadiah|gratis|claim|klaim|wallet|banking|undian|blokir|suspend)/i.test(host + u.pathname)) add(1, 'warn', 'mengandung kata pancingan (login/verifikasi/hadiah...)');
  if (/\.(apk|exe|scr|bat|msi|jar|xapk)$/i.test(u.pathname)) add(4, 'err', 'link langsung ke FILE APLIKASI - modus "undangan/resi.apk" untuk membobol HP');

  const norm = host.replace(/0/g, 'o').replace(/1/g, 'l').replace(/3/g, 'e').replace(/5/g, 's').replace(/4/g, 'a').replace(/rn/g, 'm').replace(/vv/g, 'w');

    if (norm.includes(b)) { add(3, 'err', `mirip "${b}" (typosquatting: huruf diganti angka)`); break; }

    const gaps = lines.slice(1).map((l, i) => [lines[i].y - l.y, Math.abs(lines[i].size - l.size) < 1 && Math.abs(l.size - body) < 1.5]).filter(([g, same]) => g > 0 && same).map(([g]) => g).sort((a, b) => a - b);
    const lineGap = gaps.length ? gaps[Math.floor(gaps.length * .3)] : body * 1.4;
    const paras = []; let cur = null;
    lines.forEach((l, i) => {
      const prev = lines[i - 1], gap = prev ? prev.y - l.y : 0;
      const heading = l.size >= body * 1.35 ? 1 : l.size >= body * 1.12 && l.runs.every(r => r.bold || r.size > body * 1.1) ? 2 : 0;

}
async function pdfToWord(file, log) {
  log(`PDF ke Word: ${esc(file.name)} (${kb(file.size)})`);
  const s = await pdfStructure(await file.arrayBuffer(), log);
  if (s.chars < 20) throw new Error('PDF ini tidak punya teks (hasil scan/foto). butuh OCR - lihat "man doc".');
  const D = await loadLib('docx');

  s.pages.forEach((paras, pi) => {
    if (pi) children.push(new D.Paragraph({ children: [new D.PageBreak()] }));
    for (const p of paras) children.push(new D.Paragraph({
      heading: p.heading === 1 ? D.HeadingLevel.HEADING_1 : p.heading === 2 ? D.HeadingLevel.HEADING_2 : undefined,
      spacing: { after: 120 },
      children: p.runs.map(r => new D.TextRun({ text: r.str, bold: r.bold, italics: r.italic, size: p.heading ? undefined : Math.max(16, Math.min(144, Math.round(r.size * 2))) })),
    }));
  });
  const doc = new D.Document({ creator: 'termOS', styles: { default: { document: { run: { font: 'Calibri' } } } }, sections: [{ children }] });
  const blob = await D.Packer.toBlob(doc);
  saveBlob(blob, baseName(file.name) + '.docx');
  log(`[OK] ${s.numPages} halaman, ${num(s.chars)} karakter -> ${esc(baseName(file.name))}.docx (${kb(blob.size)})`, 'ok');
  return blob;
}
async function pdfToText(file, log) {

async function imagesToPdf(files, log) {
  const L = await loadLib('pdflib'), doc = await L.PDFDocument.create();
  for (const [i, f] of files.entries()) {
    let img;
    if (/jpe?g$/i.test(f.type)) img = await doc.embedJpg(await f.arrayBuffer());
    else if (/png$/i.test(f.type)) img = await doc.embedPng(await f.arrayBuffer());
    else {
      const bmp = await createImageBitmap(f), c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height; c.getContext('2d').drawImage(bmp, 0, 0);
      img = await doc.embedJpg(await (await new Promise(r => c.toBlob(r, 'image/jpeg', .9))).arrayBuffer());
    }
    const land = img.width > img.height, W = land ? 842 : 595, H = land ? 595 : 842, m = 24, sc = Math.min((W - 2 * m) / img.width, (H - 2 * m) / img.height);
    const page = doc.addPage([W, H]);
    page.drawImage(img, { x: (W - img.width * sc) / 2, y: (H - img.height * sc) / 2, width: img.width * sc, height: img.height * sc });
    log(`  ${i + 1}/${files.length} ${esc(f.name)}`);
  }
  const blob = new Blob([await doc.save()], { type: 'application/pdf' });

}
async function mergePdf(files, log) {
  const L = await loadLib('pdflib'), doc = await L.PDFDocument.create();

    (await doc.copyPages(src, src.getPageIndices())).forEach(p => doc.addPage(p));
    log(`  + ${esc(f.name)} (${src.getPageCount()} hal)`);
  }
  const blob = new Blob([await doc.save()], { type: 'application/pdf' });
  saveBlob(blob, `gabungan-${Date.now()}.pdf`);

}
function parseRange(s, max) {
  const out = [];
  for (const part of String(s).split(',')) {
    const m = part.trim().match(/^(\d+)(?:\s*-\s*(\d+|akhir|end))?$/i); if (!m) throw new Error(`rentang tidak valid: "${part}" (contoh: 1-3,5,8-akhir)`);
    const a = +m[1], b = m[2] ? (/\d/.test(m[2]) ? +m[2] : max) : a;
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) if (i >= 1 && i <= max) out.push(i - 1);
  }
  if (!out.length) throw new Error('tidak ada halaman yang cocok');
  return out;
}
async function splitPdf(file, range, log) {
  const L = await loadLib('pdflib');
  let src; try { src = await L.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true }); } catch { throw new Error('PDF tidak bisa dibaca (rusak/terkunci password)'); }
  const idx = parseRange(range, src.getPageCount()), doc = await L.PDFDocument.create();
  (await doc.copyPages(src, idx)).forEach(p => doc.addPage(p));
  const blob = new Blob([await doc.save()], { type: 'application/pdf' });
  saveBlob(blob, `${baseName(file.name)}-hal-${String(range).replace(/[^\w,-]/g, '').replace(/,/g, '_')}.pdf`);
  log(`[OK] ambil ${idx.length} dari ${src.getPageCount()} halaman (${kb(blob.size)})`, 'ok');
  return blob;
}

async function docRun(kind) {

async function fingerprint() {
  const c = document.createElement('canvas'), x = c.getContext('2d'); c.width = 200; c.height = 40;
  x.textBaseline = 'top'; x.font = '16px Arial'; x.fillStyle = '#f60'; x.fillRect(0, 0, 100, 20); x.fillStyle = '#069'; x.fillText('termOS fp', 4, 8);
  const parts = [navigator.userAgent, navigator.language, screen.width + 'x' + screen.height, devicePixelRatio, Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.hardwareConcurrency, navigator.deviceMemory, navigator.maxTouchPoints, c.toDataURL()];
  return (await sha('SHA-256', parts.join('|'))).slice(0, 16);
}
function beep(n = 3) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < n; i++) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.value = .15; o.start(ac.currentTime + i * .25); o.stop(ac.currentTime + i * .25 + .15); }
  } catch {}
}

function parse(s) { const a = []; s.replace(/"([^"]*)"|(\S+)/g, (_, q, w) => { a.push(q ?? w); }); return a; }
function lev(a, b) { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
async function busyRun(name, fn) {
  state.busy = true; state.curCmd = name;
  try { await fn(); } catch (e) { print('error: ' + esc(e.message || e), 'err'); }
  finally { state.busy = false; state.curCmd = ''; pending = null; setSecret(false); setPrompt(); }
}
async function run(raw) {

  const args = parse(raw);
  let name = args.shift().toLowerCase(); name = ALIAS[name] || name;

  const c = CMDS[name];

    const best = Object.keys(CMDS).map(k => [k, lev(name, k)]).sort((a, b) => a[1] - b[1])[0];
    return print(`tsh: perintah tidak dikenal: ${esc(name)}${best[1] <= 2 ? ` - maksudnya <span class="ok copy" data-run="${best[0]}">${best[0]}</span>?` : ' - ketik <span class="ok copy" data-run="help">help</span>'}${!aiReady() ? '<span class="dim"> | tip: buka vault + atur AI agar kalimat biasa dijawab AI</span>' : ''}`, 'err');

/* ---------------- rain effect ---------------- */
function startRain(cv, { size = 16, fade = .1, fps = 12 } = {}) {
  const ctx = cv.getContext('2d'), chars = '01アイウエオカキクケコサシスセソタチツテト<>/{}[]#$%&*+=';
  let drops = [], stop = false, last = 0;
  const rs = () => { cv.width = innerWidth; cv.height = innerHeight; drops = Array.from({ length: Math.ceil(cv.width / size) }, () => Math.random() * -60); };
  rs(); addEventListener('resize', rs);
  (function f(t) {
    if (stop) return; requestAnimationFrame(f);
    if (t - last < 1000 / fps || document.hidden) return; last = t;
    ctx.globalAlpha = fade; ctx.fillStyle = P.bg; ctx.fillRect(0, 0, cv.width, cv.height); ctx.globalAlpha = 1;
    ctx.font = `${size}px monospace`;
    drops.forEach((y, i) => {
      ctx.fillStyle = Math.random() < .08 ? '#ffffff' : P.fg;
      ctx.fillText(chars[(Math.random() * chars.length) | 0], i * size, y * size);
      drops[i] = y * size > cv.height && Math.random() > .975 ? 0 : y + 1;
    });
  })(0);
  return () => { stop = true; removeEventListener('resize', rs); };
}

const W = 1080, H = 2400, FONT = "'JetBrains Mono','Courier New',monospace";
let wseed = 7, wroll = 0, WP = P;
const wr = () => { wseed = (wseed * 16807) % 2147483647; return wseed / 2147483647; };
function T(ctx, s, x, y, color, size = 34, weight = 400, glow = true) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.shadowColor = color; ctx.shadowBlur = glow ? 14 : 0;
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.shadowBlur = 0; return ctx.measureText(s).width;
}
function wBase(ctx) {
  ctx.fillStyle = WP.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .42, 100, W / 2, H * .42, H * .8);
  g.addColorStop(0, WP.fg + '16'); g.addColorStop(1, '#00000000'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = WP.fg + '0a'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
